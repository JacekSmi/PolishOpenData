name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release -o artifacts/packages
      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages

  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the MCP server with Native AOT (warnings are errors)
        run: dotnet publish src/PolishOpenData.Mcp/PolishOpenData.Mcp.csproj -c Release -r linux-x64 -p:AotGate=true -o artifacts/aot
      - name: Drive the AOT binary over stdio
        run: >
          python3 build/mcp-stdio-check.py
          --expect-tools lookup_company,check_vat_bank_account,check_vat_bank_account_offline,get_krs_extract,validate_identifier,find_parcel,geocode_address,property_prices
          -- artifacts/aot/PolishOpenData.Mcp
      - name: Drive the AOT binary with a REGON key set (opt-in tool is registered)
        env:
          # tools/list makes no network call, and this value is not a secret.
          POLISHOPENDATA_REGON_KEY: dummy-key-not-a-secret
        run: >
          python3 build/mcp-stdio-check.py
          --expect-tools lookup_company,check_vat_bank_account,check_vat_bank_account_offline,get_krs_extract,validate_identifier,find_parcel,geocode_address,property_prices,lookup_regon
          -- artifacts/aot/PolishOpenData.Mcp
      - name: Drive the AOT binary with a CEIDG token set (opt-in tool is registered)
        env:
          # tools/list makes no network call, and this value is not a secret.
          POLISHOPENDATA_CEIDG_TOKEN: dummy-token-not-a-secret
        run: >
          python3 build/mcp-stdio-check.py
          --expect-tools lookup_company,check_vat_bank_account,check_vat_bank_account_offline,get_krs_extract,validate_identifier,find_parcel,geocode_address,property_prices,lookup_ceidg
          -- artifacts/aot/PolishOpenData.Mcp
      - name: Publish and run the NetTopologySuite adapter probe with Native AOT (warnings are errors)
        run: |
          dotnet publish tools/AotProbe.Nts/AotProbe.Nts.csproj -c Release -r linux-x64 -p:AotGate=true -o artifacts/aot-nts
          artifacts/aot-nts/AotProbe.Nts
