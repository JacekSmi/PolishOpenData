name: nightly-smoke

on:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 06:17 Warsaw summer time
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Forks do not run the live checks (or open issues about them).
    if: github.repository == 'JacekSmi/PolishOpenData'
    runs-on: ubuntu-latest
    # Above the sum of the per-test timeouts (11 network tests x 2 min + the published-package test's 5 min) plus
    # setup and build, so a stalled registry ends as a failed test, which the report job reports, not a cancelled job.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      POLISHOPENDATA_SMOKE: '1'
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run live smoke tests
        run: >
          dotnet test --project tests/PolishOpenData.SmokeTests -c Release
          --report-xunit-markdown --report-xunit-markdown-filename smoke.md
          --results-directory artifacts/smoke
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results
          path: artifacts/smoke

  report:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download smoke test results
        # The smoke job can fail before it ever uploads an artifact (checkout, setup-dotnet, restore, build all
        # run before the tests do), in which case there is nothing named "smoke-results" to download. Don't let
        # that stop this job from still opening/updating the issue below.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-results
          path: artifacts/smoke
      - name: Open or update an issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Scheduled live smoke tests failed: $RUN_URL"
            echo
            echo "An upstream registry may have changed its API. Compare the reported fields with tests/Fixtures, update the models, and capture a new redacted fixture."
            echo
            echo "If only PublishedMcpPackageTests failed, check nuget.org, 'dotnet dnx PolishOpenData.Mcp --yes' on the runner's SDK and the latest published package, not the fixtures. If McpLiveTests failed but the library tests passed, look for a regression in the MCP server."
            echo
            cat artifacts/smoke/smoke.md 2>/dev/null || true
          } > issue.md
          gh label create smoke-failure --color B60205 --description "Scheduled live API check failed" 2>/dev/null || true
          existing=$(gh issue list --state open --label smoke-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "Live smoke test failed" --label smoke-failure --body-file issue.md
          fi
