name: nightly-smoke

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 06:17 Warsaw summer time
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      POLISHOPENDATA_SMOKE: '1'
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run live smoke tests
        run: >
          dotnet test --project tests/PolishOpenData.SmokeTests -c Release
          --report-xunit-markdown --report-xunit-markdown-filename smoke.md
          --results-directory artifacts/smoke
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: artifacts/smoke

  report:
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download smoke test results
        # The smoke job can fail before it ever uploads an artifact (checkout, setup-dotnet, restore, build all
        # run before the tests do), in which case there is nothing named "smoke-results" to download. Don't let
        # that stop this job from still opening/updating the issue below.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: smoke-results
          path: artifacts/smoke
      - name: Open or update an issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly live smoke tests failed: $RUN_URL"
            echo
            echo "An upstream registry may have changed its API. Compare the reported fields with tests/Fixtures, update the models, and capture a new redacted fixture."
            echo
            cat artifacts/smoke/smoke.md 2>/dev/null || true
          } > issue.md
          gh label create smoke-failure --color B60205 --description "Nightly live API check failed" 2>/dev/null || true
          existing=$(gh issue list --state open --label smoke-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "Nightly smoke test failed" --label smoke-failure --body-file issue.md
          fi
