name: Feature request
description: Suggest a new register, tool or API change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task you are trying to do and why the current packages do not cover it.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source
      description: The public register or API involved, with a link to its documentation if you have one.
    validations:
      required: false
