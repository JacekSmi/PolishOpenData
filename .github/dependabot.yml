version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.Extensions.*", "Microsoft.Bcl.*", "System.Text.Json", "ModelContextProtocol"]
      testing:
        patterns: ["xunit*", "Microsoft.Extensions.TimeProvider.Testing"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
