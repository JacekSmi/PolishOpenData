<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolishOpenData demo</title>
    <meta name="description" content="Pick a place in Poland and see the cadastral parcel and what flats nearby sold for. An unofficial demo of the PolishOpenData .NET libraries, using public GUGiK registers." />
    <base href="/PolishOpenData/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <noscript><style>#search, #controls { display: none; }</style></noscript>
</head>

<body>
    <!-- The map and the search box live outside #app so they paint before .NET starts and survive its start (Blazor replaces the content of #app).
         The order is the keyboard's: the search bar, then what the page shows (#app: the matches, the card), then the map. -->
    <div class="bar">
        <!-- A form, so Enter and the Search key of an on-screen keyboard submit it the same way (map.js handles the submit; nothing is sent to "#"). -->
        <form id="search-form" role="search" action="#">
            <input id="search" type="search" aria-label="Search an address" placeholder="Warming up…" autocomplete="off" spellcheck="false" enterkeyhint="search" disabled />
        </form>
        <!-- Static like the search box, so they paint at once; map.js enables them and forwards their changes to .NET. -->
        <div id="controls">
            <label class="choice"><span>Radius</span>
                <select id="radius" disabled>
                    <option value="250">250 m</option>
                    <option value="500" selected>500 m</option>
                    <option value="1000">1 km</option>
                    <option value="2000">2 km</option>
                </select>
            </label>
            <label class="choice"><span>Period</span>
                <select id="period" disabled>
                    <option value="12">12 months</option>
                    <option value="24" selected>24 months</option>
                    <option value="60">5 years</option>
                </select>
            </label>
        </div>
        <noscript><div class="notice">This demo needs JavaScript.</div></noscript>
    </div>
    <div id="start-status" class="sr-only" role="status" aria-live="polite"></div>

    <div id="app"></div>
    <div id="map"></div>

    <div id="blazor-error-ui">
        An unexpected error occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Every .js is fingerprinted (StaticWebAssetFingerprintPattern in the csproj), in dotnet run and in publish, so each reference here needs the
         placeholder: a plain src would 404. Blazor's import("./js/map.js") resolves through the import map to the same file as the script tag below,
         so there is one module and one map. The .css files stay unfingerprinted: the SDK turns a placeholder in a link's href into the plain name. -->
    <script src="lib/leaflet/leaflet#[.{fingerprint}].js"></script>
    <script type="module" src="js/map#[.{fingerprint}].js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
